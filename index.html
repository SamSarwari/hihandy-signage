<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HI-HANDY Signage Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: none;
    }
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      pointer-events: none;
    }
    video.active {
      opacity: 1;
      z-index: 2;
    }
    video.standby {
      opacity: 0;
      z-index: 1;
    }
    #status-badge {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: #00e5ff;
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 99;
      opacity: 1;
      transition: opacity 1.5s ease-out;
      pointer-events: none;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
    }
    #status-badge.fade-out {
      opacity: 0;
    }
    #banner-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(220, 38, 38, 0.95);
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      padding: 16px 24px;
      text-align: center;
      z-index: 100;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.6);
    }
    #diag-panel {
      display: none;
      position: fixed;
      top: 24px;
      left: 24px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 16px 20px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 13px;
      z-index: 101;
      line-height: 1.6;
    }
    #diag-panel.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="player-a" class="active" autoplay loop muted playsinline preload="auto"></video>
    <video id="player-b" class="standby" loop muted playsinline preload="auto"></video>
  </div>

  <div id="status-badge">⚡ HI-HANDY Signage • Initialisiere...</div>
  <div id="banner-bar"></div>
  <div id="diag-panel"></div>

  <script src="player.js"></script>
</body>
</html>
