<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HI-HANDY Signage Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: none;
    }
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    /* Alle Overlays komplett ausblenden für 100% cleanes Vollbild */
    #status-badge, #banner-bar, #debug-log {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="player" autoplay loop muted playsinline preload="auto">
      <source id="video-source" src="videos/HIHANDY_USER_LOOP_ROTATED_90.mp4" type="video/mp4">
    </video>
  </div>

  <script src="player.js"></script>
</body>
</html>
