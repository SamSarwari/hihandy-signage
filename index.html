<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HI-HANDY Signage Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: none;
    }
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 229, 255, 0.5);
      color: #00e5ff;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }
    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="player" autoplay loop muted playsinline preload="auto">
      <source id="video-source" src="videos/HIHANDY_USER_LOOP_ROTATED_90.mp4?v=sdr_clean" type="video/mp4">
    </video>
  </div>
  <div id="toast"></div>

  <script src="player.js"></script>
</body>
</html>
